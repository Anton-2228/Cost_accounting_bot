<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Add a receipt</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="screen">
    <!-- Тексты по умолчанию английские: страница переписывает их на язык
         пользователя, как только узнает его у сервиса (см. app.js). -->
    <h1 class="title" data-i18n="title">Add a receipt</h1>

    <p id="hint" class="hint" data-i18n="hint">Point the camera at the QR code at the bottom of the receipt.</p>

    <button id="scan" class="button button--primary" type="button" data-i18n="scan" disabled>Scan a receipt</button>

    <!-- Плашка распознанного чека. Показывается до расшифровки: пока
         пользователь не подтвердил, платный внешний сервис не зовётся. -->
    <section id="card" class="card" hidden>
        <dl class="card__rows">
            <div class="card__row">
                <dt data-i18n="card_table">Spreadsheet</dt>
                <dd id="card-table"></dd>
            </div>
            <div class="card__row" id="card-total-row" hidden>
                <dt data-i18n="card_total">Amount</dt>
                <dd id="card-total"></dd>
            </div>
            <div class="card__row" id="card-date-row" hidden>
                <dt data-i18n="card_date">Date</dt>
                <dd id="card-date"></dd>
            </div>
        </dl>
        <div class="card__actions">
            <button id="confirm" class="button button--primary" type="button" data-i18n="confirm">Add</button>
            <button id="cancel" class="button" type="button" data-i18n="cancel">Cancel</button>
        </div>
    </section>

    <p id="status" class="status" hidden></p>

    <!-- Отложенные чеки: отсканированы, но налоговая их пока не отдала. Живут
         на сервере, поэтому видны и после того, как приложение закрыли. -->
    <section id="pending" class="pending" hidden>
        <h2 class="pending__title" data-i18n="pending_title">Waiting for the tax service</h2>
        <ul id="pending-list" class="pending__list"></ul>
    </section>
</main>

<!-- `?v=` — чтобы клиент Telegram не показал новую страницу со старым скриптом:
     WebView кэширует статику агрессивно. -->
<script src="config.js?v=2"></script>
<script src="locales.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
