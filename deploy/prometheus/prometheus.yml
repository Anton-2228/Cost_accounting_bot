# Конфигурация Prometheus. Монтируется в контейнер только на чтение.
#
# Целей здесь намеренно мало. Метрики есть у одного сервиса — приёма чеков, — и
# это не недоделка: только он видит скан целиком (кто сканировал, какой формат,
# сколько шёл внешний сервис, чем кончилось). Сколько чеков и товаров лежит в
# системе, Grafana спрашивает у Postgres напрямую — там это точное число,
# пережившее все перезапуски, а не счётчик в памяти процесса.

global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Адрес — имя сервиса из docker-compose и ВНУТРЕННИЙ порт: публиковать ничего
  # не нужно, Prometheus живёт в той же сети. Ровно так же api ходит в бота по
  # адресу telegram-bot:8002.
  - job_name: checks-service
    metrics_path: /metrics
    static_configs:
      - targets: ["checks-service:8000"]

  # Сам Prometheus: без него незаметен отказ скрейпа (up == 0) и переполнение
  # хранилища.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Заготовка на случай, если понадобится живой сигнал о разборе чека — «начал
  # и не закончил». Честное место для него — бот, а не api: телеграм-id есть
  # только там. У бота уже есть свой uvicorn (telegram_bot/notify_server.py),
  # порт наружу не публикуется, и цель достанется по docker-сети.
  # - job_name: telegram-bot
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["telegram-bot:8002"]
