# Источники данных Grafana. Заводятся файлом, а не мышью: иначе после
# пересоздания контейнера дашборд смотрел бы в пустоту, а восстановление
# сводилось бы к воспоминаниям.
#
# Источников два, и это отражает разделение, на котором держится всё наблюдение:
#   Prometheus — числа во времени (сколько сканов, сколько отказов, как долго
#                отвечает внешний сервис расшифровки);
#   Postgres   — содержимое (строка QR, ссылка на чек, реквизиты, товары).
# Наоборот не бывает: строка чека в метке метрики означала бы новый временной
# ряд на каждую покупку.

apiVersion: 1

# Пересоздание вместо накопления: без этого переименование источника оставило бы
# рядом мёртвый старый, и панели молча смотрели бы в него.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Postgres
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # Правка мышью запрещена: источник описан этим файлом, и изменение в UI
    # пережило бы ровно до следующего перезапуска, сбивая с толку всё это время.
    editable: false
    jsonData:
      # Совпадает со scrape_interval: иначе Grafana подставляет в $__interval
      # шаг мельче шага сбора, и график получается дырявым.
      timeInterval: 15s

  - name: Postgres
    uid: postgres-ro
    type: grafana-postgresql-datasource
    access: proxy
    # Имя сервиса compose и внутренний порт. Наружу база опубликована только на
    # 127.0.0.1:5433, и этот адрес тут ни при чём.
    url: db:5432
    # Роль только на SELECT и только по четырём таблицам: см.
    # deploy/postgres/grafana_readonly.sql. Учётные данные api сюда не годятся —
    # у Grafana не должно быть возможности что-либо записать.
    user: grafana_ro
    database: ${GRAFANA_DB_NAME}
    editable: false
    secureJsonData:
      # Grafana разворачивает ${VAR} из окружения контейнера прямо здесь,
      # поэтому пароль лежит в env/grafana.env, а не в репозитории.
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      # Трафик не покидает docker-сеть, и сертификата у контейнера базы нет.
      sslmode: disable
      postgresVersion: 1600
      # Grafana — не пользователь системы, а наблюдатель: пула в четыре
      # соединения хватает, а больше значило бы отнимать их у api.
      maxOpenConns: 4
      timescaledb: false
