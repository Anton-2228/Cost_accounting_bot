services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: env/postgres.env
    environment:
      TZ: UTC
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Скрипт роли grafana_ro. Смонтирован для запуска руками и только для
      # него — в /docker-entrypoint-initdb.d его класть НЕЛЬЗЯ. Хуки initdb
      # выполняются при создании кластера, когда таблиц ещё нет: их создаёт
      # `alembic upgrade head` из контейнера api, то есть заведомо позже. GRANT
      # на несуществующую таблицу — ошибка, а ошибка в хуке роняет инициализацию
      # целиком, и база просто не поднимется. Порядок обязан быть «сначала
      # миграции, потом гранты», см. README, раздел «Наблюдение».
      - ./deploy/postgres:/opt/sql:ro
    ports:
      # Наружу не публикуем: доступ только из docker-сети и с локальной машины.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: dockerfiles/api.Dockerfile
    restart: unless-stopped
    env_file: env/api.env
    environment:
      # Блок environment имеет приоритет над env_file.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Контейнер живёт в UTC; сутки и день сброса считаются в часовом поясе
      # владельца документа (колонка spreadsheets.timezone).
      TZ: UTC
      # Куда толкать уведомления. Порт бота не опубликован наружу — адрес
      # разрешается только внутри docker-сети.
      BOT_NOTIFY_URL: http://telegram-bot:8002/notify
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8010:8000"
    healthcheck:
      # Именно /health/ready: он проверяет доступность Postgres. Проверка
      # /health в старой версии проходила у api, не способного обслужить запрос.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  google-sheets-service:
    build:
      context: .
      dockerfile: dockerfiles/google_sheets_service.Dockerfile
    restart: unless-stopped
    env_file: env/google_sheets_service.env
    environment:
      # Блок environment имеет приоритет над env_file.
      API_BASE_URL: http://api:8000/api/v1
      GOOGLE_CREDENTIALS_PATH: /run/secrets/google_sa.json
      TZ: UTC
    volumes:
      # Ключ сервисного аккаунта монтируется только для чтения: внутри
      # контейнера его нельзя ни изменить, ни удалить.
      - ./secrets/google_sa.json:/run/secrets/google_sa.json:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Наружу не публикуем: эндпоинты служебные, доступ только с локальной
      # машины.
      - "127.0.0.1:8011:8000"
    healthcheck:
      # /health отдаёт итог последнего прохода. Сервис без входящих запросов
      # иначе выглядел бы здоровым, молча не разбирая очередь.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Состояние диалогов должно переживать перезапуск контейнера: иначе мастер
    # создания таблицы рассыпался бы посреди ввода.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  telegram-bot:
    build:
      context: .
      dockerfile: dockerfiles/telegram_bot.Dockerfile
    restart: unless-stopped
    env_file: env/telegram_bot.env
    environment:
      # Блок environment имеет приоритет над env_file.
      API_BASE_URL: http://api:8000/api/v1
      REDIS_HOST: redis
      NOTIFY_PORT: 8002
      TZ: UTC
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Порт наружу не публикуется: notify-сервер служебный, его зовёт только api
    # из docker-сети. Сам бот работает через long polling и входящих
    # соединений из интернета не ждёт.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  checks-service:
    build:
      context: .
      dockerfile: dockerfiles/checks_service.Dockerfile
    restart: unless-stopped
    env_file: env/checks_service.env
    environment:
      # Блок environment имеет приоритет над env_file.
      API_BASE_URL: http://api:8000/api/v1
      TZ: UTC
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Единственный сервис, до которого доходит запрос из интернета, — но и он
      # слушает только 127.0.0.1: наружу его выводит веб-сервер хоста, у
      # которого уже есть домен и сертификат (deploy/nginx/checks.conf.example).
      # Порт открыт для 127.0.0.1, а не для 0.0.0.0, именно поэтому: обойти
      # HTTPS и проверку подписи снаружи нельзя.
      - "127.0.0.1:8012:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    # Тег пиннуется, как у postgres и redis: `latest` однажды сменит формат
    # хранилища под уже накопленными данными.
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Полгода: метрик мало (десятки рядов), а сравнить нагрузку с прошлым
      # сезоном иначе не с чем.
      - --storage.tsdb.retention.time=180d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      checks-service:
        condition: service_healthy
    ports:
      # Наружу не публикуем: интерфейс Prometheus нужен только чтобы проверить
      # цели и отладить запрос. Смотрят в него через Grafana.
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana-db-init:
    # Одноразовый сервис: заводит роль grafana_ro и выходит. Нужен затем, чтобы
    # права выдавались САМИ, но в единственный момент, когда это возможно, —
    # после того как api накатил миграции и таблицы появились.
    #
    # Почему не миграцией alembic. Миграции применяет точка входа api под
    # `set -euo pipefail`, и ей понадобился бы GRAFANA_DB_PASSWORD: не задан —
    # api не стартует вовсе, то есть вся система падала бы из-за ненастроенной
    # Grafana. Сверх того, роль и её пароль — не состояние схемы: пароль меняют
    # и права досыпают повторно, а миграция выполняется однажды и «переприменить»
    # её нечем. Здесь же скрипт идемпотентен и прогоняется на каждом `up -d`,
    # поэтому смена пароля в env-файле доезжает до базы сама.
    #
    # Образ тот же, что у базы: нужен только psql.
    image: postgres:16
    restart: "no"
    env_file: env/postgres.env
    environment:
      # Отсюда скрипт понимает, что работает не изнутри контейнера базы, и берёт
      # пароль владельца из того же env-файла.
      PGHOST: db
      TZ: UTC
    volumes:
      - ./deploy/postgres:/opt/sql:ro
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["sh", "/opt/sql/10-grafana-readonly.sh"]

  grafana:
    image: grafana/grafana-oss:11.4.0
    restart: unless-stopped
    env_file: env/grafana.env
    environment:
      # Блок environment имеет приоритет над env_file.
      #
      # Адрес ВНЕШНИЙ, а не тот, на котором Grafana слушает: из root_url она
      # строит абсолютные ссылки — в уведомлениях алертов, в шаринге панелей, в
      # части редиректов. Стоял бы здесь loopback, ссылка из письма вела бы на
      # машину получателя.
      #
      # Собирается из тех же переменных, что и публикация grafana-proxy: адрес
      # не должен разъезжаться с тем, на котором Grafana реально открывается.
      GF_SERVER_ROOT_URL: https://${GRAFANA_PUBLIC_HOST:-root-hub.ru}:${GRAFANA_PUBLIC_PORT:-41142}/
      # Регистрация и анонимный вход закрыты: за этим входом видно, кто что
      # покупал. Единственный способ войти — пароль из env/grafana.env.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Вход опубликован в интернет, поэтому кука сессии не должна уходить по
      # незашифрованному соединению. Работает это в паре с `X-Forwarded-Proto
      # $scheme` из deploy/nginx/grafana.conf.example: TLS снимает nginx хоста,
      # до контейнера запрос доходит по HTTP, и без заголовка Grafana сочла бы
      # соединение незащищённым и куку не отдала бы вовсе.
      #
      # Оба входа шифрованы, поэтому работают оба: https://root-hub.ru:41142
      # снаружи и https://192.168.100.114:41142 из локальной сети.
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      # Телеметрия наружу: система учитывает личные расходы, и отчёты о
      # использовании ей ни к чему.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      TZ: UTC
    volumes:
      # Источники и дашборды — только на чтение: они описаны файлами в
      # репозитории, правка мышью запрещена провижинингом.
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Своя sqlite: пользователи, сессии, избранное. Без тома вход пришлось бы
      # заводить заново после каждого пересоздания контейнера.
      - grafana_data:/var/lib/grafana
    depends_on:
      # Не «база жива», а «роль заведена»: без гранта Grafana поднялась бы с
      # источником, который отвечает «permission denied», и это читалось бы как
      # сломанный дашборд.
      grafana-db-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    ports:
      # Как и всё остальное — только 127.0.0.1, хотя наружу Grafana теперь
      # выведена. Именно поэтому loopback здесь обязателен тем более: снаружи в
      # неё ведёт ровно один путь — grafana-proxy на 41142, где терминируется
      # TLS и стоит ограничение частоты попыток входа. Опубликуй контейнер на
      # 0.0.0.0 — и рядом появится второй вход, без шифрования и без лимита.
      #
      # Сам loopback оставлен ради SSH-туннеля: с него смотрят Grafana с
      # локальной машины, не выходя в интернет (README, раздел «Наблюдение»).
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana-tls-init:
    # Одноразовый сервис: выпускает самоподписанный сертификат для
    # grafana-proxy и выходит. Он нужен затем, чтобы развёртывание на новом
    # сервере не требовало ни одной ручной команды — раньше здесь стоял
    # `openssl req` из README, который надо было не забыть выполнить.
    #
    # Скрипт идемпотентен и прогоняется на каждом `up -d`: перевыпускает, только
    # если файлов нет, срок подходит к концу или изменился список имён. Значит
    # смена адреса в .env доезжает до сертификата сама.
    #
    # Образ тот же, что у базы: нужен только openssl. Отдельный образ ради
    # одной утилиты — лишний повод не собраться на сервере за блокировками.
    image: postgres:16
    restart: "no"
    environment:
      GRAFANA_PUBLIC_HOST: ${GRAFANA_PUBLIC_HOST:-root-hub.ru}
      # Имена и адреса, по которым в Grafana заходят. Нужны ОБА вида: снаружи
      # приходят по имени, из локальной сети — по адресу хоста (имя изнутри
      # уходит на шлюз и без NAT loopback не возвращается). Сертификат без
      # нужного имени дал бы вторую ошибку в браузере, о несовпадении.
      GRAFANA_TLS_SAN: ${GRAFANA_TLS_SAN:-DNS:root-hub.ru,IP:192.168.100.114,IP:95.31.139.53}
      TZ: UTC
    volumes:
      - grafana_tls:/etc/ssl/grafana
      - ./deploy/tls:/opt/tls:ro
    entrypoint: ["sh", "/opt/tls/10-grafana-cert.sh"]

  grafana-proxy:
    # Единственный путь к Grafana снаружи. Здесь терминируется TLS и стоит
    # ограничение частоты попыток входа; сама Grafana остаётся на loopback.
    #
    # Раньше эту роль играл nginx хоста, а конфиг раскладывался руками из
    # deploy/nginx/*.example. Теперь он поднимается вместе со стеком: на новом
    # сервере достаточно `docker compose up -d`.
    #
    # Mini App сюда НЕ переезжает и переезжать не должен: он остаётся на nginx
    # хоста, на 80-м порту и за шлюзом, который терминирует ему TLS. Свести их
    # вместе значило бы поставить содержимое чеков на одно имя и один порт с
    # публичной страницей.
    image: nginx:alpine
    restart: unless-stopped
    environment:
      # Подставляется в шаблон конфига штатным entrypoint-ом образа. envsubst
      # трогает только объявленные здесь переменные, поэтому $host и $scheme в
      # шаблоне остаются переменными nginx.
      GRAFANA_PUBLIC_HOST: ${GRAFANA_PUBLIC_HOST:-root-hub.ru}
      TZ: UTC
    volumes:
      - ./deploy/nginx/grafana.conf.template:/etc/nginx/templates/grafana.conf.template:ro
      # Сертификат только на чтение: выпускает его grafana-tls-init, и правки
      # отсюда всё равно затёрлись бы при следующем перевыпуске.
      - grafana_tls:/etc/ssl/grafana:ro
    depends_on:
      # Не «сертификат где-то есть», а «сервис отработал»: без файлов nginx не
      # стартует вовсе, и это читалось бы как сломанный образ.
      grafana-tls-init:
        condition: service_completed_successfully
      grafana:
        condition: service_healthy
    ports:
      # ЕДИНСТВЕННЫЙ порт всего стека, смотрящий в 0.0.0.0. Внешний адрес и порт
      # задаются в .env — для переезда на другой сервер править compose не надо.
      #
      # Публикация порта docker-ом идёт мимо ufw: правило ufw на 41142 не нужно
      # и ничего не изменит. Закрывать вход надо здесь, привязкой к адресу.
      - "${GRAFANA_PUBLIC_BIND:-0.0.0.0}:${GRAFANA_PUBLIC_PORT:-41142}:41142"
    healthcheck:
      # Проверяется цепочка целиком, до самой Grafana: nginx, живой без неё,
      # отвечал бы 502 на каждый запрос и считался бы здоровым.
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O- https://localhost:41142/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pg_data:
  redis_data:
  # Метрики и настройки Grafana. Про них надо помнить при бэкапе — но потеря их
  # не смертельна: точные числа лежат в pg_data, а дашборды в репозитории.
  prometheus_data:
  grafana_data:
  # Сертификат и ключ для grafana-proxy. Том, а не каталог в репозитории:
  # приватный ключ не место в git, а срок жизни у него — как у сервера, не как
  # у ветки. Потеря тома не страшна: grafana-tls-init выпустит заново сам.
  grafana_tls:
