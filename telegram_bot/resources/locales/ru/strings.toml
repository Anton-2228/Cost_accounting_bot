# Короткие строки бота. Ключ — путь из таблиц через точку: `[buttons.menu]` и
# поле `table` дают `buttons.menu.table`. Подстановки — `{имя}`, как у
# `str.format`; буквальная фигурная скобка пишется двойной.
#
# Русский каталог — исходный: остальные языки переводятся с него, и тест
# `test_i18n_catalog.py` следит, чтобы ключи и подстановки у всех совпадали.

